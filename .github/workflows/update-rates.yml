name: 환율 데이터 자동 갱신

on:
  schedule:
    # 매일 UTC 00:00 (KST 09:00) 실행
    - cron: '0 0 * * *'
  workflow_dispatch:  # 수동 실행 가능

jobs:
  update-csv:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 환율 데이터 갱신
        run: python scripts/update_csv.py

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add krw/krw.csv
          git diff --staged --quiet || git commit -m "환율 데이터 자동 갱신 $(date +%Y-%m-%d)"
          git push
